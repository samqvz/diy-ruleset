name: Build Custom Rules
on:
  workflow_dispatch:
  schedule:
    - cron: "22 22 * * *"
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'main.go'
      - 'add/**'
      - 'remove/**'
      - 'core/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      singbox_ver: ""
      mihomo_ver: ""
      BUILDTIME: ""
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'

      - name: Init Time & Get Core Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

          SB_VER=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases | grep '"tag_name":' | grep -E 'alpha' | head -n 1 | sed -E 's/.*"v([^"]+)".*/\1/' | tr -d '\n\r')
          echo "singbox_ver=${SB_VER}" >> $GITHUB_ENV
          
          MI_VER=$(curl -sL https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt | tr -d '\n\r')
          echo "mihomo_ver=${MI_VER}" >> $GITHUB_ENV

      - name: Cache Core Binaries
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: |
            ./sing-box
            ./mihomo
          key: cores-${{ runner.os }}-sb_${{ env.singbox_ver }}-mi_${{ env.mihomo_ver }}

      - name: Download Cores
        if: steps.cache-cores.outputs.cache-hit != 'true'
        run: |
          echo "⏬ 正在下载 sing-box v${{ env.singbox_ver }}..."
          curl -fL "https://github.com/SagerNet/sing-box/releases/download/v${{ env.singbox_ver }}/sing-box-${{ env.singbox_ver }}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -zxf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box
          rm sing-box.tar.gz

          echo "⏬ 正在下载 mihomo ${{ env.mihomo_ver }}..."
          curl -fL "https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-linux-amd64-v3-go120-${{ env.mihomo_ver }}.gz" -o mihomo.gz
          gzip -d < mihomo.gz > ./mihomo
          chmod +x ./mihomo
          rm mihomo.gz

      - name: Move Cores to System PATH
        run: |
          sudo cp ./sing-box /usr/local/bin/sing-box
          sudo cp ./mihomo /usr/local/bin/mihomo
          sudo chmod +x /usr/local/bin/sing-box /usr/local/bin/mihomo

      - name: Execute Go Rule Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run main.go

      - name: Push Rules to publish branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init -q
          git checkout -q -b publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Auto Build Rules on ${{ env.BUILDTIME }}" || echo "No changes to commit"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" publish